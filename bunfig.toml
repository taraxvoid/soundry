[install]
minimumReleaseAge = 604800 # 7 days

[install.security]
scanner = "@socketsecurity/bun-security-scanner"

# Packages that bypass the gate
minimumReleaseAgeExcludes = ["@types/bun", "bun-types","astro", "@astrojs/sitemap", "@astrojs/check", "@astrojs/react","@astrojs/compiler-rs", "@astrojs/markdown-satteri","@playwright/test","playwright","playwright-core","@astrojs/compiler-binding"]
