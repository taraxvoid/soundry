name: CI

on:
  push:
    branches: [main, next, live]
  pull_request:
    branches: [main, next, live]
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Cache npm package dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint workflow files
        run: bun run lint:actions

      - name: Security audit of npm dependencies
        run: bun run audit
        continue-on-error: true

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run check

      - name: Unit tests
        run: bun run test:unit

      - name: Build
        run: bun run build

      - name: Check file changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          filters: |
            lockfile:
              - 'bun.lock'
            checker_script:
              - 'scripts/check-licenses.ts'

      - name: Check dependency licenses (block GPL family)
        if: steps.changes.outputs.lockfile == 'true' || steps.changes.outputs.checker_script == 'true'
        run: bun run check:licenses

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Fast e2e — mobile only (main)
        if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main') || (github.event_name == 'push' && github.ref_name == 'main') }}
        run: bun run test:e2e:isolated

      - name: Broader e2e + a11y (next)
        if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'next') || (github.event_name == 'push' && github.ref_name == 'next') }}
        run: |
          bun run test:e2e:all
          bun run test:a11y

      - name: Full e2e + a11y + lighthouse (live)
        if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'live') || (github.event_name == 'push' && github.ref_name == 'live') }}
        run: |
          bun run test:e2e:all
          bun run test:a11y
          bun run test:e2e:lighthouse

      - name: Link checker (weekly + PRs to main)
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main') }}
        run: bun run check:links

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-reports
          path: |
            playwright-report/
            test-results/
